name: Проверки

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, openssl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Синтаксис PHP
        run: |
          status=0
          while IFS= read -r f; do php -l "$f" > /dev/null || status=1; done < <(find . -name '*.php' -not -path './.git/*')
          exit $status

      - name: Синтаксис JavaScript
        run: for f in assets/js/*.js tools/*.js; do node --check "$f"; done

      - name: Цены в браузере и на сервере совпадают
        run: node tools/test-pricing.js

      - name: Страницы, ссылки и разметка
        run: php tools/ci-check.php
